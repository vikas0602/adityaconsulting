    <style>
        :root {
            --royal-blue-dark: #0f2b5c;
            --royal-blue: #1e40af;
            --royal-blue-bright: #2563eb;
            --silver-grey: #94a3b8;
            --silver-grey-light: #e2e8f0;
            --silver-grey-dark: #64748b;
            --text-dark: #0f172a;
            --text-muted: #475569;
            --bg-white: #ffffff;
            --bg-offwhite: #f8fafc;
            --border: #e2e8f0;
            --radius-lg: 16px;
            --radius-md: 10px;
            --card-shadow: 0 10px 30px -5px rgba(15, 43, 92, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { color: var(--text-dark); line-height: 1.7; background-color: var(--bg-offwhite); display: flex; flex-direction: column; min-height: 100vh; }

        header {
            background: rgba(255, 255, 255, 0.98);
            border-bottom: 1px solid var(--border);
            padding: 1rem 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo-container { display: flex; align-items: center; gap: 0.85rem; text-decoration: none; }
        .logo-img { height: 45px; width: auto; object-fit: contain; }
        .logo-text { display: flex; flex-direction: column; }
        .logo-title { font-size: 1.35rem; font-weight: 800; color: var(--royal-blue-dark); line-height: 1.1; }
        .logo-subtitle { color: var(--silver-grey-dark); font-size: 0.78rem; font-weight: 600; }

        nav { display: flex; align-items: center; gap: 1.25rem; }
        nav a { text-decoration: none; color: var(--text-dark); font-weight: 600; font-size: 0.92rem; }
        nav a:hover { color: var(--royal-blue-bright); }
        .btn-contact { background: var(--royal-blue-bright); color: white !important; padding: 0.55rem 1.25rem; border-radius: 6px; }

        main { flex: 1; padding: 3.5rem 6%; }
        .job-container {
            max-width: 860px;
            margin: 0 auto;
            background: var(--bg-white);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 3rem;
            box-shadow: var(--card-shadow);
        }

        .back-link {
            display: inline-block;
            color: var(--royal-blue-bright);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.92rem;
            margin-bottom: 1.5rem;
        }
        .back-link:hover { text-decoration: underline; }

        .job-badge-row { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1.25rem; }
        .badge {
            background: #eff6ff;
            color: var(--royal-blue);
            border: 1px solid #bfdbfe;
            padding: 0.35rem 0.9rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        h1 { font-size: 2.25rem; font-weight: 800; color: var(--royal-blue-dark); margin-bottom: 1.5rem; line-height: 1.2; }
        .job-description { color: var(--text-muted); font-size: 1.05rem; margin-bottom: 2.5rem; white-space: pre-line; }

        .action-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
            align-items: center;
            justify-content: space-between;
        }

        .btn-apply {
            background: var(--royal-blue-bright);
            color: white;
            padding: 0.95rem 2.25rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            transition: background 0.3s ease;
        }
        .btn-apply:hover { background: var(--royal-blue); }

        .btn-copy {
            background: var(--bg-offwhite);
            color: var(--royal-blue-dark);
            border: 1px solid var(--silver-grey);
            padding: 0.9rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.92rem;
            cursor: pointer;
        }
        .btn-copy:hover { background: var(--silver-grey-light); }

        footer { background: #091322; color: var(--silver-grey); padding: 3rem 6% 2rem; text-align: center; font-size: 0.9rem; margin-top: auto; }
        @media (max-width: 640px) {
            header { flex-direction: column; gap: 1rem; }
            nav { flex-wrap: wrap; justify-content: center; }
            .job-container { padding: 1.75rem; }
            h1 { font-size: 1.75rem; }
        }
    </style>
</head>
<body>

<header>

</main>

<footer>

<!-- PapaParse to pull Row 4 (Index 3) from Google Sheet -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
    const JOB_ROW_INDEX = 3; 
    const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS8fSuqnv0t8wlTAlKZZZoVa7BslSZgWskTVakzORGEtpCrgD-ec8WfMXlK--f3TQZMWF4rfMAe-6hg/pub?gid=0&single=true&output=csv";

    document.addEventListener("DOMContentLoaded", function() {
        Papa.parse(GOOGLE_SHEET_CSV_URL, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                const validJobs = results.data.filter(j => j.Title && j.Title.trim() !== "");
                const job = validJobs[JOB_ROW_INDEX];
                renderSingleJob(job);
            }
        });
    });

    function renderSingleJob(job) {
        const container = document.getElementById("jobContent");
        if (!job) {
            container.innerHTML = `<h1>Mandate Filled or Closed</h1><p class="job-description">This executive search mandate is no longer active. Please view our <a href="jobs.html">Current Jobs</a> page for open leadership opportunities.</p>`;
            return;
        }

        document.title = `${job.Title} - Aditya HR Consulting`;
        const subject = encodeURIComponent(`Executive Application: ${job.Title} (${job.Location || 'Global'})`);

        container.innerHTML = `
            <div class="job-badge-row">
                <span class="badge">📍 ${job.Location || 'Global / GCC'}</span>
                <span class="badge">🏢 ${job.WorkModel || 'On-site'}</span>
                <span class="badge">💼 ${job.Industry || 'Executive Search'}</span>
            </div>
            <h1>${job.Title}</h1>
            <div class="job-description">${job.Summary || job.Description || 'Confidential leadership search assignment.'}</div>
            <div class="action-bar">
                <a href="mailto:vikas@adityaconsulting.net?subject=${subject}" class="btn-apply">Apply / Inquire Confidentially</a>
                <button class="btn-copy" onclick="copyPageLink(this)">Copy Shareable Link</button>
            </div>
        `;
    }

    function copyPageLink(btn) {
        navigator.clipboard.writeText(window.location.href);
        const originalText = btn.innerText;
        btn.innerText = "✓ Link Copied!";
        setTimeout(() => { btn.innerText = originalText; }, 2500);
    }
</script>
</body>
